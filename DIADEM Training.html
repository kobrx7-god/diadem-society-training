const LES=[
{id:"rop",path:"/mun/rop",t:"Rules of Procedure",s:[
["Objectives & introduction","<p>Rules of Procedure (RoP) keep debate orderly, fair and productive. The <b>Chair</b> applies the rules, recognises speakers and rules on points and motions; <b>delegates</b> drive the session by speaking and by proposing motions. <b>Formal debate</b> follows speakers’ lists and set times; <b>informal debate</b> (caucuses) allows freer discussion. A typical session: roll call → quorum → agenda → GSL → caucuses → working papers → draft resolutions → amendments → closure → voting → adjournment.</p>"],
["Points",T(["Point","Purpose","Raised","Misuse"],[["Personal Privilege","Physical discomfort or inaudible speaker (e.g. temperature, volume)","Any time; the only point that may interrupt a speaker","Using it to make arguments"],["Order","Procedure is being broken","When the error occurs; Chair rules (DIADEM’s chit-only Point of Order is for debates, not MUN)","Disputing content, not procedure"],["Parliamentary Inquiry","Ask the Chair about the rules or what comes next","When no speaker is holding the floor","Seeking strategic advice"],["Information","Question to a speaker who accepted points","After a speech, if the speaker yielded to points","Making speeches as questions"],["Right to Reply","Answer remarks impugning your delegation’s integrity","In writing/at Chair’s discretion","Replying to mere disagreement"]])+"<p class=fb>Standard: Privilege, Order, Inquiry. Conference-specific: how Information and Right to Reply are allowed, and whether the Chair may refuse them.</p>"],
["Motions",T(["Motion","Purpose","Typical vote*"],[["Open debate / set agenda","Begin formal business on a topic","Simple majority"],["Moderated caucus","Structured topic debate","Simple majority"],["Unmoderated caucus","Free negotiation","Simple majority"],["Extend caucus","Add time","Often limited"],["Introduce draft / amendment","Place document on floor","Chair / sponsors"],["Close debate","End debate on the matter","Often two-thirds, with speakers against"],["Enter voting procedure","Begin substantive voting","Per conference"],["Suspend / adjourn","Pause / end the meeting","Simple majority"]])+"<p class=fb>*Thresholds vary by conference. Check the RoP.</p><div class=ex><b>Formulation:</b> “The delegation of [Country] motions for a moderated caucus of [total duration], with a speaking time of [individual time], on the topic of [topic].”</div><p>Motions are generally voted in order of disruptiveness: the most disruptive (longest, furthest from debate) is usually taken first, but the Chair decides.</p>"],
["Yields","<p>After a speech a delegate may <b>yield to the Chair</b> (time ends), <b>yield to another delegate</b> (who uses remaining time), or <b>yield to Points of Information</b>. Many conferences forbid yielding to another delegate, or allow only one yield; some forbid yields in caucuses. Check the rules.</p>"],
["Scenarios","<p><b>1.</b> A delegate raises a Point of Order to disagree with another’s facts: the Chair rules it out of order; content is answered in speeches. <b>2.</b> Two moderated-caucus motions compete: the Chair takes the longer one first. <b>3.</b> A delegate challenges a ruling: only if the conference RoP provides an appeal, usually decided by vote.</p>"]],
q:[["A speaker cannot be heard. Which point applies?",["Order","Personal Privilege","Information","Right to Reply"],1,"Privilege covers audibility and comfort, and may interrupt."],["True or false: every conference uses identical vote thresholds.",["True","False"],1,"Thresholds are conference-specific."],["You want to ask the Chair what happens after a vote. Raise a…",["Point of Information","Point of Order","Parliamentary Inquiry","Motion to adjourn"],2,"Inquiries concern the rules and procedure."]]},
{id:"res",path:"/mun/resolutions",t:"Draft Resolution Writing",s:[
["Foundations","<p>A <b>working paper</b> is an informal, unvoted set of ideas. A <b>draft resolution</b> is a formal document with sponsors and signatories that the committee may vote on. <b>Sponsors</b> write it and support it fully; <b>signatories</b> only want it debated. Everything must fall within the <b>committee mandate</b>.</p>"],
["Structure","<p>Heading (committee, topic, sponsors, signatories), then <i>preambulatory clauses</i> (context), then numbered <b>operative clauses</b> (action). A final operative clause ends in a full stop.</p><div class=ex><i>Recalling</i> its resolution on safe drinking water,<br><i>Deeply concerned</i> that millions lack access,<br>1. <u>Calls upon</u> Member States to publish national water plans;<br>2. <u>Requests</u> the Secretary-General to report within one year.</div>"],
["Principles","<p>Be specific, feasible, relevant and diplomatic; use the committee’s real authority; link clauses logically; name an implementer, a timeline and a funding source. An <b>idea</b> says “improve water access”; an <b>implementable solution</b> says who does what, by when, funded how.</p>"]],
q:[["Who fully backs a draft resolution?",["Signatories","Sponsors","Observers","The Chair"],1,"Sponsors authored and support it; signatories only want it discussed."],["Operative clauses are…",["Italicised, unnumbered","Numbered, ending in semicolons"],1,"Standard form, though conferences vary."]]},
{id:"pre",path:"/mun/resolutions/preambulatory",t:"Preambulatory Clause Writing",s:[
["Purpose","<p>Preambulatory clauses establish context, legal and historical foundations, and cite earlier resolutions, treaties and reports. They never act.</p>"],
["Phrases","<p><i>Affirming, Alarmed by, Aware of, Bearing in mind, Deeply concerned, Emphasizing, Guided by, Having considered, Noting with concern, Recognizing, Recalling, Reaffirming, Taking into account, Welcoming.</i> Vary them; do not open five clauses with the same phrase.</p>"],
["Formatting","<p>Phrases are italicised or underlined; clauses are not numbered; each ends with a comma. Some conferences differ.</p>"],
["Exercise","<div class=ex><b>Weak:</b> <i>Concerned</i> about hunger, <br><b>Better:</b> <i>Deeply concerned</i> that, according to the FAO, hunger has risen in recent years despite commitments under Sustainable Development Goal 2,<br>It names a source, a framework and a specific problem. (Verify any statistic you cite.)</div>"]],
q:[["Preambulatory clauses end with…",["A semicolon","A comma","A full stop"],1,"Commas; the final operative clause takes the full stop."],["Which is a preambulatory phrase?",["Urges","Recalling","Establishes"],1,"“Recalling” sets context; the others are operative."]]},
{id:"op",path:"/mun/resolutions/operative",t:"Operative Clause Writing",s:[
["Purpose & powers","<p>Operative clauses propose action. Choose verbs by authority: the General Assembly generally <b>recommends</b> (<i>calls upon, encourages, urges, requests</i>); in general only the Security Council can adopt binding decisions (<i>decides</i>, <i>demands</i>), and bodies differ in what they may do. Check your committee’s mandate before using <i>Decides</i> or <i>Establishes</i>.</p>"],
["Verbs","<p>Calls upon, Encourages, Recommends, Requests, Urges, Condemns, Supports, Invites, Establishes, Decides, Further recommends, Further requests. <b>Further</b> verbs avoid repeating the same word.</p>"],
["Formatting","<p>Numbered; verb underlined; semicolons; the last clause ends with a full stop; subclauses use a consistent scheme (a, b, c, then i, ii, iii).</p>"],
["Framework","<p>Ask: <b>Who</b> acts? <b>What</b> action? <b>How</b> implemented? <b>Who benefits</b>? <b>Financed</b> by? <b>Outcome</b>?</p><div class=ex><b>Vague:</b> Urges countries to fix education.<br><b>Actionable:</b> <u>Requests</u> UNESCO to coordinate, with voluntary contributions from Member States, a teacher-training programme for rural schools in least developed countries, reporting progress within two years;</div>"]],
q:[["Which body’s resolutions can be legally binding in general?",["General Assembly","Security Council","Both equally"],1,"GA resolutions are mostly recommendatory."],["Which is the most actionable?",["Urges peace","Requests the Secretary-General to report to the Council within six months"],1,"It names an actor and a timeline."]]},
{id:"sp",path:"/mun/speeches",t:"Speech Writing",s:[
["Building a speech","<p>Build around <b>position → argument → evidence → proposed action → conclusion</b>. Represent your national policy, not your own opinion. Be concise and use formal vocabulary.</p>"],
["Avoid","<ul><li>Repeating the same point</li><li>Empty phrases with no content</li><li>Unsupported or invented statistics</li><li>Irrelevant history</li><li>Aggressive rhetoric</li><li>Reading like an essay: write for the ear</li></ul>"]],
q:[["A good speech ends with…",["A new topic","A clear proposed direction and diplomatic close","More statistics"],1,"It leaves a clear action."]]},
{id:"gsl",path:"/mun/speeches/gsl",t:"General Speakers’ List Speeches",s:[
["Structure","<p>1 Formal opening · 2 National position · 3 Context · 4 Principal argument · 5 Proposed direction · 6 Diplomatic conclusion.</p>"+T(["Time","Plan"],[["60s","Opening, position, one argument, one proposal, close"],["90s","Add context and evidence"],["120s","Add a second argument or a response to earlier speakers"]])],
["Example","<div class=ex>Honourable Chair, distinguished delegates. [Country] believes that safe drinking water is a precondition of development. Unsafe water causes illness and keeps children out of school. [Country] therefore supports regional funding for local water infrastructure, and urges delegates to prioritise implementation. Thank you.</div><p>Each sentence maps to a section: opening, position, context, argument, direction, conclusion.</p>"]],
q:[["A GSL speech is…",["Broad, setting out your position","Narrow, on one caucus topic"],0,"GSL speeches are general; caucus speeches are narrow."]]},
{id:"mod",path:"/mun/speeches/moderated",t:"Moderated Caucus Speeches",s:[
["Differences from the GSL","<p>Speak <b>directly to the caucus topic</b>, make <b>one strong argument</b>, use relevant evidence, propose a focused solution, and respond to earlier delegates. Never repeat your GSL speech.</p>"+T(["Time","Plan"],[["30s","Point + one reason + proposal"],["45s","Add evidence"],["60s","Add rebuttal or implementation"]])],
["Example","<div class=ex>[Country] agrees with the delegate of [X] on monitoring, but a report alone will not help. We propose a regional fund managed by [body], reviewed yearly. Thank you.</div>"]],
q:[["The best moderated-caucus speech…",["Restates the opening","Makes one focused argument on the topic"],1,"Focus is what the format rewards."]]},
{id:"bpf",path:"/debate/format",t:"BP Format & Roles",s:[
["The format","<p><b>British Parliamentary (BP)</b> has four teams of two, eight speakers in all. Two teams sit on the <b>Government</b> bench and two on the <b>Opposition</b>: Opening Government (OG), Opening Opposition (OO), Closing Government (CG) and Closing Opposition (CO). Teams are <b>ranked 1st to 4th</b>, so you compete against your own bench’s other team as well as the opposing side. Teams receive the motion (and any info slide), then prepare without internet; DIADEM sessions use a fifteen-minute prep timer.</p>"],
["Speaker roles",T(["#","Speaker","Team","Core job"],[["1","Prime Minister","OG","Define the motion, set the case, give the first arguments"],["2","Leader of the Opposition","OO","Accept the definition, rebut, present the opposition case"],["3","Deputy Prime Minister","OG","Rebuild and rebut, add to the OG case"],["4","Deputy Leader of the Opposition","OO","Rebuild and rebut, add to the OO case"],["5","Member of Government","CG","Extension: new, distinct material"],["6","Member of Opposition","CO","Extension: new, distinct material"],["7","Government Whip","CG","Summarise the debate; no new arguments"],["8","Opposition Whip","CO","Summarise the debate; no new arguments"]])+"<p class=fb>Speech lengths vary. Many tournaments use seven minutes; DIADEM sessions may use shorter timings. Check the Debate RoP.</p>"],
["Ranking & common mistakes","<p>Teams are usually scored 3, 2, 1, 0 for 1st to 4th in a round, but scoring is tournament-specific. Common mistakes: closing teams repeating the opening case, contradicting their own bench’s opening team, and the whips adding new arguments.</p>"]],
q:[["How many teams debate in a BP round?",["Two","Four","Eight"],1,"Four teams of two, ranked 1st to 4th."],["Whips should…",["Introduce new arguments","Summarise and weigh the debate"],1,"New material belongs to the extension speakers."]]},
{id:"bpr",path:"/debate/rop",t:"Debate Rules of Procedure",s:[
["Separate rulebooks","<p>DIADEM has a <b>Debate Rules of Procedure</b> separate from the MUN RoP. Do not carry MUN habits (motions, caucuses, yields) into a debate, or the reverse.</p>"],
["Points of Information (POIs)","<p>A POI is a short question or challenge offered to a speaker from the <b>opposing</b> bench while they hold the floor. The speaker may accept or decline. Standard BP practice is that POIs are not offered during protected time (generally the first and last minute), and an accepted POI should be brief. In DIADEM sessions the bell rings when POIs open and close, twice at time, and three times when grace runs out. Check the Debate RoP for exact limits.</p>"],
["Points of Order: by chit only","<p>In DIADEM, a <b>Point of Order</b> in a debate covers a <b>factual or procedural inaccuracy</b> and is raised <b>only by chit</b>, not spoken. This is specific to debates. In MUN, procedural points are raised in committee, not by chit. Disagreeing with an argument is not a Point of Order: answer it in your own speech. Check the Debate RoP for who receives the chit and how it is handled.</p>"+T(["","MUN","Debate Union"],[["Rulebook","MUN RoP","Debate RoP"],["Point of Order","Procedural error, raised in committee","Factual or procedural inaccuracy, by chit only"],["Questions to speaker","Point of Information after a yield","POIs from the opposing bench during unprotected time"]])],
["Common misuse","<ul><li>Sending a chit because you disagree with a claim</li><li>Interrupting aloud to raise a Point of Order</li><li>Offering POIs from your own bench</li><li>Accepting no POIs, or too many</li></ul>"]],
q:[["How is a Point of Order raised in a DIADEM debate?",["By speaking","By chit only","By a motion"],1,"Per DIADEM’s Debate RoP: chit only, in debates."],["A speaker gets a date wrong. Under DIADEM’s Debate RoP you…",["Send a Point of Order chit for a factual inaccuracy","Shout the correction"],0,"Factual or procedural inaccuracies go by chit. Disagreement over interpretation is rebutted in your speech."]]},
{id:"bps",path:"/debate/speeches",t:"Speeches by Role",s:[
["Opening half","<p><b>PM:</b> define the motion fairly (no squirreling), give a brief framework, then two or three developed arguments. <b>LO:</b> accept the definition, rebut the PM, present your own case. <b>DPM and DLO:</b> rebut, rebuild your leader’s case, and add depth or one further argument.</p>"],
["Closing half","<p><b>Members (extension):</b> a new, distinct argument that does not contradict your opening team, and an explanation of why it matters. <b>Whips:</b> no new arguments; summarise the clash, weigh the key issues and explain why your bench won.</p>"],
["A speech plan","<p>Over a seven-minute speech: a short introduction, rebuttal, constructive material, and a brief conclusion. Shorter timings keep the order and trim each part.</p><div class=ex>“Madam Speaker, the Opposition says this policy will fail because enforcement is weak. Our second argument shows why enforcement is exactly what the policy fixes…”</div>"]]
,q:[["A closing team’s extension should…",["Repeat the opening case","Bring a new, distinct argument"],1,"The extension must add something the opening half did not."]]},
{id:"bpc",path:"/debate/case",t:"Case Building & Rebuttal",s:[
["Building an argument","<p>Use <b>claim → reason → evidence or mechanism → impact</b>. State what is true, why, how it works, and why it matters for the motion.</p><div class=ex>Claim: subsidised transport raises employment. Reason: it widens job access. Mechanism: lower cost lets people reach more employers. Impact: higher incomes and lower dependence.</div>"],
["Rebuttal & weighing","<p>Rebut in four steps: <b>they say, we say, because, therefore</b>. Compare arguments, saying why yours matters more (scale, likelihood, severity). Use POIs to expose weaknesses, not to make speeches.</p>"],
["Mistakes","<ul><li>Assertions with no mechanism</li><li>Ignoring the other side’s best argument</li><li>Rebuttal with no comparison</li></ul>"]],
q:[["The strongest rebuttal…",["Says the other side is wrong","Explains why, then weighs against your argument"],1,"Rebuttal needs reasons and comparison."]]},
];

const $=s=>document.querySelector(s),app=$("#app");
const G=()=>{try{return JSON.parse(localStorage.getItem("diadem-p"))||{d:{},h:[]}}catch(e){return{d:{},h:[]}}},S=p=>{try{localStorage.setItem("diadem-p",JSON.stringify(p))}catch(e){}};
const by=id=>LES.find(l=>l.id==id),link=(h,t,c="")=>`<a href="#${h}" class="${c}">${t}</a>`;

const cur=()=>{const s=stat();return s.next?link(s.next.path,s.n?"Continue Learning":"Begin Training","btn f"):""};
function curr(h){return MODS.filter(m=>!h||m.h==h).map(m=>`<details open><summary>${m.n} — ${m.t}</summary>${m.ids.map(i=>by(i)).map(l=>`<a class=doc href="#${l.path}"><span>${String(LES.indexOf(l)+1).padStart(2,"0")}</span><b>${l.t}</b><i>${G().d[l.id]?"Completed ✓":"Read→"}</i></a>`).join("")}</details>`).join("")}
const V={"/"(){const s=stat();return`<div class=hero><div><p class=k>Society for Diplomacy, International Affairs, Development, Engagement &amp; Multilateralism</p><h1>The art of<br><em>deliberation.</em></h1><p class=lead>A structured learning programme in diplomacy, parliamentary procedure, resolution drafting, and diplomatic communication.</p>${s.next?cur():link("/progress","View Progress","btn f")}${link("/mun","Explore MUN","btn")}${link("/debate","Debate Union","btn")}</div><div class=orb><b></b><i class=lg></i></div></div>
<div class=row><div><span class=n>01</span><br>Rules of Procedure<p class=fb>Motions, points and committee proceedings.</p></div><div><span class=n>02</span><br>Draft Resolution Writing<p class=fb>Formulate and structure effective resolutions.</p></div><div><span class=n>03</span><br>Speech Writing<p class=fb>Structured, persuasive, diplomatic speeches.</p></div><div><span class=n>04</span><br>British Parliamentary Debate<p class=fb>Format, Debate RoP, speeches and case building.</p></div></div>
<div class=row><div><span class=n>${s.m}/${MODS.length}</span><br>Modules completed</div><div><span class=n>${s.n}/${LES.length}</span><br>Lessons completed</div><div><span class=n>${s.pct}%</span><br>Overall completion</div></div><h2>Curriculum</h2>${curr()}`},
"/mun"(){return`<p class=k>MUN Training</p><h1>Curriculum Overview</h1><p class=lead>Seven lessons across three modules. Each states generally accepted MUN practice and flags where conferences vary.</p>${curr("mun")}`},
"/debate"(){return`<p class=k>Debate Union</p><h1>British Parliamentary Debate</h1><p class=lead>Four lessons on the BP format and DIADEM’s separate Debate RoP, including chit-only Points of Order.</p>${curr("debate")}`},
"/progress"(){const s=stat(),p=s.p;return`<p class=k>Learning Progress</p><h1>${s.pct}% complete</h1><div class=bar><i style="width:${s.pct}%"></i></div><p>${s.n} completed · ${LES.length-s.n} remaining</p>${cur()}<h2>By module</h2>${MODS.map(m=>{const d=m.ids.filter(i=>p.d[i]).length;return`<p>${m.n} ${m.t} — ${d}/${m.ids.length}</p><div class=bar><i style="width:${100*d/m.ids.length}%"></i></div>`}).join("")}<h2>History</h2>${p.h.length?p.h.slice().reverse().map(h=>`<p class=fb>${new Date(h.t).toLocaleString("en-GB")} — completed ${by(h.id).t}</p>`).join(""):"<p class=fb>No lessons completed yet.</p>"}<p><button class=btn id=rs>Reset progress</button></p>`}};
function lesson(l){const i=LES.indexOf(l),p=G(),pv=LES[i-1],nx=LES[i+1];return`<p class=k>Module · Lesson ${i+1} of ${LES.length}</p><h1>${l.t}</h1>${l.s.map(x=>`<section><h2>${x[0]}</h2>${x[1]}</section>`).join("")}<h2>Knowledge check</h2>${l.q.map((q,k)=>`<div class=q data-c=${q[2]}><b>${q[0]}</b>${q[1].map((o,j)=>`<button data-j=${j}>${o}</button>`).join("")}<p class=fb></p><i hidden>${q[3]}</i></div>`).join("")}<p><button class="btn f" id=cp>${p.d[l.id]?"Completed ✓ (undo)":"Mark lesson complete"}</button></p><p>${pv?link(pv.path,"← "+pv.t):""} ${nx?link(nx.path,nx.t+" →"):""}</p>`}
function render(){setTimeout(fx,0);let p=(location.hash.slice(1)||"/").replace(/\/$/,"")||"/";const l=LES.find(x=>x.path==p);app.innerHTML=l?lesson(l):(V[p]||(()=>`<h1>Page not found</h1>${link("/","Return home")}`))();document.title="DIADEM Training";scrollTo(0,0);document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",(x=>x==p||(x!="/"&&p.startsWith(x)))(a.getAttribute("href").slice(1))));
if(l){app.querySelectorAll(".q").forEach(q=>q.onclick=e=>{const b=e.target.closest("button");if(!b||q.dataset.done)return;q.dataset.done=1;const c=+q.dataset.c;q.querySelectorAll("button").forEach((x,j)=>x.className=j==c?"ok":x==b?"no":"");q.querySelector(".fb").textContent=(+b.dataset.j==c?"Correct. ":"Not quite. ")+q.querySelector("i").textContent});
$("#cp").onclick=()=>{const g=G();if(g.d[l.id]){delete g.d[l.id]}else{g.d[l.id]=1;g.h.push({id:l.id,t:Date.now()})}S(g);render()}}
if(p=="/progress")$("#rs").onclick=()=>{if(confirm("Reset all learning progress? This cannot be undone.")){S({d:{},h:[]});render()}}}

function fx(){document.querySelectorAll("main h1").forEach(h=>{let i=0;const w=n=>[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t.trim()){f.append(t);return}const s=document.createElement("span");s.className="w";s.style.animationDelay=i++*.09+"s";s.textContent=t;f.append(s)});c.replaceWith(f)}else w(c)});w(h)});
document.querySelectorAll(".row>div,.q,.ex,.doc").forEach(e=>{e.classList.add("sp");e.onmousemove=v=>{const r=e.getBoundingClientRect();e.style.setProperty("--x",v.clientX-r.left+"px");e.style.setProperty("--y",v.clientY-r.top+"px")}});

document.querySelectorAll(".n").forEach(e=>{const t=e.textContent;if(!/[%\/]/.test(t))return;const s=performance.now(),a=v=>{const k=Math.min(1,(v-s)/900),z=1-Math.pow(1-k,3);e.textContent=t.replace(/\d+/g,m=>Math.round(m*z));k<1&&requestAnimationFrame(a)};requestAnimationFrame(a)});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll("main section,main h2,.row,.q,details").forEach(e=>{e.classList.add("rv");io.observe(e)})}
